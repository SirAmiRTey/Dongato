<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d38" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="emeraldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad512)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="170" fill="url(#glowGrad512)" />

  <!-- Center Badge -->
  <rect x="106" y="106" width="300" height="300" rx="84" fill="url(#emeraldGrad512)" filter="url(#shadow512)" />

  <!-- Inner Subtle Border -->
  <rect x="110" y="110" width="292" height="292" rx="80" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-opacity="0.45" />

  <!-- Persian 'د' (Dongato) Calligraphic / Typographic representation -->
  <text
    x="256"
    y="305"
    font-family="Vazirmatn, Tahoma, sans-serif"
    font-size="196"
    font-weight="900"
    text-anchor="middle"
    fill="#091428"
    letter-spacing="-2"
  >د</text>

  <!-- Split/Coin accent dot in top right -->
  <circle cx="352" cy="160" r="18" fill="#f8fafc" opacity="0.95" />
</svg>
