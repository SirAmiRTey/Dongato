services:
  # ==============================================================================
  # 1. PostgreSQL Database Service
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: dongato-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dongato}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dongato_secure_password_replace_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - dongato-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-dongato}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==============================================================================
  # 2. PostgREST RESTful API Engine
  # ==============================================================================
  rest:
    image: postgrest/postgrest:v12.0.2
    container_name: dongato-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-dongato_secure_password_replace_in_prod}@db:5432/${DB_NAME:-dongato}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-dongato-production-32-chars-long}
    networks:
      - dongato-network

  # ==============================================================================
  # 3. Application Frontend (Vite SPA + Nginx Gateway)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://localhost:3000}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyZWZlcmVuY2UiOiJkb25nYXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDAwMDAwMDAsImV4cCI6MTkwMDAwMDAwMH0.signature}
    container_name: dongato-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    networks:
      - dongato-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  dongato-network:
    name: dongato-network
    driver: bridge

volumes:
  postgres_data:
    name: dongato_postgres_data
    driver: local
